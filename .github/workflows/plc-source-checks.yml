name: PLC source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Check PLC and FANUC sources without device access
        run: python -B tools/check_plc_release.py
